<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0b0d;
            --orange: #ff7a1a;
            --orange-glow: rgba(255, 122, 26, 0.55);
            --blue: #3f80c5;
            --blue-glow: rgba(63, 128, 197, 0.55);
            --text: #f0eee7;
            --text-soft: #8a8f98;
            --line: rgba(255, 255, 255, 0.15);
            --hair: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 12% 8%, rgba(255, 122, 26, 0.16), transparent 42%),
                radial-gradient(circle at 88% 92%, rgba(63, 128, 197, 0.18), transparent 42%),
                var(--bg);
            font-family: 'IBM Plex Mono', monospace;
            color: var(--text);
            padding: 0 0 4rem;
        }

        .wrap {
            max-width: 560px;
            margin: 0 auto;
            padding: 3rem 1.25rem 0;
        }

        header {
            margin-bottom: 2.2rem;
        }

        .eyebrow {
            font-size: 0.7rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text-soft);
        }

        h1 {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 600;
            font-size: clamp(1.9rem, 6vw, 2.5rem);
            letter-spacing: 0.03em;
            margin: 0.25rem 0 0;
            color: var(--text);
        }

        .subhead {
            font-size: 0.8rem;
            color: var(--text-soft);
            margin-top: 0.4rem;
        }

        /* ---- New task bar ---- */
        .add-row {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 2.4rem;
        }

        .add-row input[type="text"] {
            flex: 1;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.95rem;
            padding: 0.75rem 0.9rem;
            border: 1px solid var(--hair);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
        }

        .add-row input[type="text"]::placeholder { color: var(--text-soft); }

        .add-row input[type="text"]:focus-visible {
            outline: 2px solid var(--orange);
            outline-offset: 1px;
        }

        .add-btn {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-size: 0.82rem;
            border: none;
            border-radius: 6px;
            padding: 0 1.3rem;
            background: var(--orange);
            color: #1a0f05;
            cursor: pointer;
            transition: box-shadow 0.15s ease, transform 0.12s ease;
        }

        .add-btn:hover { box-shadow: 0 0 16px var(--orange-glow); }
        .add-btn:active { transform: translateY(1px); }
        .add-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

        /* ---- Runway rows ---- */
        .runway {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.85rem 0;
            border-bottom: 1px solid var(--hair);
        }

        .row:last-child { border-bottom: none; }

        .dot-link { display: flex; text-decoration: none; flex-shrink: 0; }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--orange);
            box-shadow: 0 0 7px var(--orange-glow);
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }

        .dot.done {
            background: var(--blue);
            box-shadow: 0 0 7px var(--blue-glow);
        }

        .rule {
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .row-title {
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
            white-space: nowrap;
        }

        .row-title.done {
            color: var(--text-soft);
            text-decoration: line-through;
            text-decoration-color: var(--blue);
        }

        .tear-link {
            font-family: 'Chakra Petch', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-soft);
            border: 1px solid var(--hair);
            border-radius: 4px;
            padding: 0.3rem 0.5rem;
            flex-shrink: 0;
            transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
        }

        .tear-link:hover {
            background: var(--orange);
            color: #1a0f05;
            border-color: var(--orange);
        }

        .tear-link:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

        .empty-runway {
            padding: 2.5rem 0;
            color: var(--text-soft);
            font-size: 0.9rem;
        }
        .empty-runway strong {
            display: block;
            font-family: 'Chakra Petch', sans-serif;
            font-size: 1.05rem;
            color: var(--text);
            letter-spacing: 0.02em;
            margin-bottom: 0.3rem;
        }

        @media (max-width: 480px) {
            .row-title { white-space: normal; }
            .add-row { flex-direction: column; }
            .add-btn { padding: 0.8rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <div class="eyebrow">Control panel</div>
        <h1>ToDo</h1>
        <p class="subhead">Orange until it lands, blue once it's cleared.</p>
    </header>

    <div class="add-row">
        <form action="/" method="post" style="display:flex; gap:0.6rem; flex:1;">
            <input type="text" name="title" placeholder="New task…" required autocomplete="off">
            <button type="submit" class="add-btn">Add</button>
        </form>
    </div>

    <ul class="runway" th:if="${not #lists.isEmpty(tasks)}">
        <li class="row" th:each="task : ${tasks}">
            <a th:href="@{/{id}/toggle(id=${task.id})}" class="dot-link" th:title="${task.completed} ? 'Mark pending' : 'Mark done'">
                <span class="dot" th:classappend="${task.completed} ? 'done' : ''"></span>
            </a>
            <span class="rule"></span>
            <span class="row-title" th:classappend="${task.completed} ? 'done' : ''" th:text="${task.title}">Task title</span>
            <a th:href="@{/{id}/delete(id=${task.id})}" class="tear-link">Clear</a>
        </li>
    </ul>

    <div class="empty-runway" th:if="${#lists.isEmpty(tasks)}">
        <strong>Runway's clear.</strong>
        Add a task above to light it up.
    </div>
</div>
</body>
</html>
